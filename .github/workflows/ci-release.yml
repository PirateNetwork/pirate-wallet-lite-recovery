name: Native tests, packages, and signed releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Give release pushes separate groups: even pending main runs must not be
  # replaced when another push arrives. Other branches/PRs keep latest-run wins.
  group: native-${{ github.workflow }}-${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref_type != 'tag') }}

env:
  PYTHON_VERSION: '3.13.16'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  validate-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      trusted_sha: ${{ steps.validate.outputs.trusted_sha }}
      mode: ${{ steps.validate.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate main push or matching version tag
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" = 'refs/heads/main' ]; then
            python scripts/validate_release.py --mode main-push --ref "$RELEASE_REF" --sha "$RELEASE_SHA" --default-branch "$DEFAULT_BRANCH"
          else
            python scripts/validate_release.py --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --default-branch "$DEFAULT_BRANCH"
          fi

  build:
    name: Test and package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            architecture: x64
          - target: linux-x64
            runner: ubuntu-22.04
            architecture: x64
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
          - target: macos-arm64
            runner: macos-14
            architecture: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.architecture }}
      - name: Install the pinned native wheel dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
      - name: Test source with synthetic wallets
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python -m pirate_wallet_lite_recovery --self-test
          python scripts/test_build_release.py
      - name: Test release validation and signing with temporary fixtures
        if: matrix.target == 'linux-x64'
        run: |
          python scripts/test_release_validation.py
          python scripts/test_signing.py
      - name: Build and test the extracted native package
        run: python scripts/build_release.py --target '${{ matrix.target }}'
      - name: Save only the package archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign:
    name: Sign and verify complete release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: [validate-release, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release-signing
    steps:
      # The signer is checked out from the immutable default-branch commit validated
      # by the gate, never from arbitrary tag code. No dependency installation here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            release-signing
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: native-*
          path: unsigned
          merge-multiple: true
      - name: Sign packages and checksums in a temporary GPG keyring
        env:
          LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_B64 }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: python scripts/sign_release.py --input unsigned --output signed --version "$RELEASE_VERSION" --public-key release-signing/public_key.asc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: signed/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-release:
    name: Publish main prerelease or prepare stable draft
    needs: [validate-release, sign]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: release-signing
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-release
          path: release-assets
      - name: Create release with verified commit and signed assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          RELEASE_MODE: ${{ needs.validate-release.outputs.mode }}
        run: |
          if [ "$RELEASE_MODE" = 'main-push' ]; then
            # Create the immutable per-commit tag at the built SHA, never the
            # current branch tip. A retry may reuse that exact tag, not move it.
            if tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null); then
              if [ "$tag_sha" != "$RELEASE_SHA" ]; then
                echo 'Release tag already exists at a different commit.' >&2
                exit 1
              fi
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA" --silent
            fi
            {
              printf 'Automatic signed prerelease from main.\n\nVersion: `%s`\n\nSource commit: `%s`\n\n' "$RELEASE_VERSION" "$RELEASE_SHA"
              cat release-signing/RELEASE-NOTES.md
            } > release-notes.md
            # gh uploads assets in a draft before automatically publishing it.
            # Existing releases are never overwritten or deleted on a rerun.
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
              --target "$RELEASE_SHA" --prerelease --latest=false \
              --title "Pirate Wallet Lite Recovery $RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag \
              --title "Pirate Wallet Lite Recovery $RELEASE_TAG" \
              --notes-file release-signing/RELEASE-NOTES.md
          fi
